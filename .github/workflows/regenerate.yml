name: Regenerate

# Pull the current schema from the Buf Schema Registry
# (buf.build/authorizerdev/authorizer), regenerate the stubs, and open a PR if
# anything changed. This is the "bump the proto version" mechanism — no human
# ever clones the main repo and hand-copies files.
on:
  workflow_dispatch:
  schedule:
    # Weekly, Monday 06:00 UTC.
    - cron: "0 6 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Regenerate
        run: make generate
      - name: Build & vet
        run: |
          go build ./...
          go vet ./...
      - name: Open PR on change
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: regenerate stubs from BSR"
          title: "chore: regenerate stubs from BSR"
          body: |
            Automated regeneration from `buf.build/authorizerdev/authorizer`.
            Review the diff before merging.
          branch: chore/regenerate-stubs
          delete-branch: true
